name: swift build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (macOS)
    # macos-latest tracks the freshest available image. The package
    # declares a macOS 26.3 floor; if GitHub-hosted runners haven't
    # caught up yet, expect this job to fail until they do — the floor
    # is intentional, see docs/README.md § Platform Requirements.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-path
          xcrun --show-sdk-version

      - name: swift build (all products)
        run: swift build

      - name: swift build (CodeEditorPlugin)
        run: swift build --target CodeEditorPlugin

      - name: swift build (CodeEditorUI)
        run: swift build --target CodeEditorUI

      - name: swift test --parallel
        run: swift test --parallel
