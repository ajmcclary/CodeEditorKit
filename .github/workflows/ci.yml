name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build & reliable tests
    # macos-26 is GitHub's current macOS runner generation (Apple unified
    # macOS/Xcode version numbering around "26" in 2025); at authoring time
    # its image ships Xcode 26.0.1 through 26.6. This package's manifest
    # declares `swift-tools-version: 6.3`, which needs a Swift toolchain new
    # enough to parse that manifest version — newer than some `macos-26`
    # images may default to. Rather than hardcoding a specific Xcode build
    # (which would go stale as the image rolls forward, e.g. once a future
    # Xcode 27 lands), the step below selects the newest Xcode already
    # installed on the runner. Fallback: if no `/Applications/Xcode_*.app`
    # is found (e.g. this runs on a non-macOS-26 image), it leaves
    # `xcode-select` untouched and the build proceeds with the runner's
    # default toolchain. (The `|| true` inside the substitution matters:
    # Actions runs steps with `bash -eo pipefail`, so a non-matching glob
    # would otherwise abort the step at the assignment, before the
    # fallback branch is reached.)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The sibling ajmcclary/* dependency repos (DesignKit, LanguageKit) are
      # private; the default GITHUB_TOKEN is scoped to this repository only,
      # so SwiftPM's git clones need a read-scoped fine-grained PAT, stored as
      # the WORKSPACE_READ_PAT repo secret. Guarded so forks without the
      # secret still run (and fail only at the clone, as before).
      - name: Authenticate git for private sibling repos
        env:
          WORKSPACE_READ_PAT: ${{ secrets.WORKSPACE_READ_PAT }}
        run: |
          if [ -n "$WORKSPACE_READ_PAT" ]; then
            git config --global url."https://x-access-token:${WORKSPACE_READ_PAT}@github.com/ajmcclary/".insteadOf "https://github.com/ajmcclary/"
            echo "Configured authenticated clone for github.com/ajmcclary"
          else
            echo "WORKSPACE_READ_PAT not set; private sibling clones will fail"
          fi

      - name: Select newest available Xcode
        run: |
          latest="$( (ls -d /Applications/Xcode_*.app 2>/dev/null || true) | sort -V | tail -n1)"
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          else
            echo "No /Applications/Xcode_*.app found; keeping the runner's default toolchain"
          fi
          xcodebuild -version
          swift --version

      - name: swift build
        run: swift build

      # Test scope is intentionally narrower than `swift test --parallel`.
      # The full suite has a documented pre-existing snapshot/AppKit failure
      # baseline (CodeEditorUITests, CodeEditorViewTests, CodeEditorPluginTests
      # — see the workspace superproject's
      # docs/architecture/baseline-2026-07-13.md and this repo's CLAUDE.md)
      # recorded under a local Xcode 27 beta toolchain; whether that same
      # failure set reproduces on this runner's stable Xcode has not yet been
      # verified. Rather than ship a CI job that is red on day one for
      # reasons unrelated to a given PR's change, this job runs `swift build`
      # (all targets) plus the suites below, which are non-snapshot, have no
      # AppKit-hosted-window dependency, and were confirmed green locally
      # against this same commit:
      #   - CodeEditorHygieneTests           (the five Scripts/verify-*.py gates)
      #   - CodeEditorCommonTests
      #   - CodeEditorHighlightingCoreTests
      #   - CodeEditorTextModelTests
      #   - CodeEditorLSPTests
      #   - CodeEditorLSPIntegrationTests
      #   - CodeEditorCompletionTests        (includes LanguageCatalogCharacterizationTests
      #                                        and CEPLanguageRegistryTests, which pin
      #                                        LanguageKit-catalog behavior)
      # To expand this job to the full suite: run `swift test --parallel` on
      # this runner's actual Xcode image, compare the failure set against the
      # documented baseline above, and either fix genuine regressions or
      # record a runner-verified baseline before switching this step to the
      # unfiltered command.
      - name: swift test (reliable suites)
        run: |
          swift test \
            --filter CodeEditorHygieneTests \
            --filter CodeEditorCommonTests \
            --filter CodeEditorHighlightingCoreTests \
            --filter CodeEditorTextModelTests \
            --filter CodeEditorLSPTests \
            --filter CodeEditorLSPIntegrationTests \
            --filter CodeEditorCompletionTests
