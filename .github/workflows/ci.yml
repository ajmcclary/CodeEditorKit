# GENERATED by Scripts/sync-package-ci in the CodeEditor workspace superproject.
# Edit the generator there, not this file: `Scripts/sync-package-ci --check`
# (run by Scripts/verify-all) fails when this file drifts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so upstream dependency rot (a dead submodule URL, a yanked tag)
    # surfaces within days instead of at the next push.
    - cron: "9 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 27 · build & reliable tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (expects macOS 27 + Xcode 27)
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sw_vers -productVersion | grep -q '^27\.' || { echo "::error::expected a macOS 27 host (package floor is macOS 27)"; exit 1; }
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.' || { echo "::error::expected Xcode 27"; exit 1; }
      - name: Install the pinned swiftlint
        run: |
          version="$(awk '/^swiftlint_version:/ {print $2}' .swiftlint.yml)"
          test -n "$version" || { echo "::error::.swiftlint.yml has no swiftlint_version"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/$version/portable_swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" --version
      - name: swift build
        run: swift build
      - name: swift test (reliable suites)
        run: |
          swift test \
            --filter CodeEditorHygieneTests \
            --filter CodeEditorCommonTests \
            --filter CodeEditorHighlightingCoreTests \
            --filter CodeEditorTextModelTests \
            --filter CodeEditorLSPTests \
            --filter CodeEditorLSPIntegrationTests \
            --filter CodeEditorCompletionTests

  lint:
    name: swiftlint --strict
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned swiftlint
        run: |
          version="$(awk '/^swiftlint_version:/ {print $2}' .swiftlint.yml)"
          test -n "$version" || { echo "::error::.swiftlint.yml has no swiftlint_version"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/$version/portable_swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" --version
      - name: swiftlint --strict
        run: swiftlint --strict
