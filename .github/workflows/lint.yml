name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: swiftlint --strict
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint --version

      - name: Run swiftlint
        # `.swiftlint.yml` already sets `strict: true`, but pass --strict
        # explicitly so any drift in the config still fails the build.
        run: swiftlint --strict
