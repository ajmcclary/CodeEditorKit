name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: xcodebuild generic/platform=iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # DesignKit/LanguageKit are private; the default GITHUB_TOKEN cannot
      # clone them during SwiftPM resolution. Same guarded PAT rewrite as
      # ci.yml (secret WORKSPACE_READ_PAT).
      - name: Authenticate git for private sibling repos
        env:
          WORKSPACE_READ_PAT: ${{ secrets.WORKSPACE_READ_PAT }}
        run: |
          if [ -n "$WORKSPACE_READ_PAT" ]; then
            git config --global url."https://x-access-token:${WORKSPACE_READ_PAT}@github.com/ajmcclary/".insteadOf "https://github.com/ajmcclary/"
            echo "Configured authenticated clone for github.com/ajmcclary"
          else
            echo "WORKSPACE_READ_PAT not set; private sibling clones will fail"
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: xcodebuild CodeEditorPlugin (iOS)
        run: |
          xcodebuild \
            -scheme CodeEditorPlugin \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: xcodebuild CodeEditorPlugin (iOS Simulator)
        run: |
          xcodebuild \
            -scheme CodeEditorPlugin \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO
