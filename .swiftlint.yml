# Custom rules for TCA patterns
custom_rules:
  no_print_statements:
    included: '.*\.swift'
    excluded: '.*Tests\.swift'
    name: "No print statements"
    regex: '\bprint\('
    message: "Use logger.debug() instead of print statements"
    severity: warning

  mark_formatting:
    included: '.*\.swift'
    name: "MARK Format"
    regex: '// MARK: -? (?![A-Z])'
    message: "MARK comment should be followed by a capitalized section name"
    severity: warning


  sendable_conformance:
    included: '.*\.swift'
    name: "Sendable Conformance"
    regex: 'enum\s+Action(?!.*:\s*.*Sendable)'
    message: "Action enums must conform to Sendable for Swift 6 compliance"
    severity: error
    
  state_equatable_conformance:
    included: '.*\.swift'
    name: "State Equatable Conformance"
    regex: 'struct\s+State(?!.*:\s*.*Equatable)'
    message: "State structs must conform to Equatable for TCA"
    severity: error
    
  # Removed observable_state_annotation - was incorrectly flagging structs that have @ObservableState on the line above
    
  dependency_macro_usage:
    included: '.*\.swift'
    name: "Dependency Macro Usage"
    regex: '\bDependencyValues\.\w+\s*='
    message: "Use @Dependency macro instead of direct DependencyValues assignment"
    severity: warning
    
  # Removed reducer_annotation - was incorrectly flagging structs that have @Reducer on the line above

  test_store_usage:
    included: '.*Tests\.swift'
    name: "Test Store Usage"
    regex: '(?<!Test)Store\(initialState:'
    message: "Use TestStore instead of Store in tests"
    severity: error
    
  # effect_return_type - removed due to configuration issues
    
  # Removed store_scope_deprecation - was incorrectly flagging valid TCA 1.0+ syntax

  allow_nsstring_drawing:
    included: '.*\.swift'
    name: "Allow NSString Drawing"
    regex: 'NSString\(string:\s*[^)]+\)\.(?!draw)'
    message: "Use Swift String methods instead of NSString, except for drawing APIs"
    severity: warning




# Reporting
reporter: "xcode" # Use "json" for CI/CD integration

# Additional Swift 6 and TCA configurations
strict: true # Enable strict mode for better Swift 6 compliance

# Identifier configurations for TCA patterns
# type_name configuration is already defined above
  
private_outlet:
  allow_private_set: true # TCA often uses private(set) for state properties
  
# SwiftLint version
swiftlint_version: 0.59.1