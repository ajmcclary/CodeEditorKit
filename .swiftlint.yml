# Rule configurations
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - ui
    - to
    - up
    - on
    - ok
    - no
    - is
    - at
    - by
    - dx
    - dy
    - x
    - y
    - z

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  allowed_symbols: ["_"]
  excluded:
    - UI

function_parameter_count:
  warning: 7
  error: 10
  ignores_default_parameters: true # TCA initializers often have many default parameters

cyclomatic_complexity:
  warning: 20 # Higher threshold for TCA reducers
  error: 30
  ignores_case_statements: true

nesting:
  type_level:
    warning: 4 # Allow deeper nesting for TCA feature composition
    error: 6
  function_level:
    warning: 5
    error: 7
    
