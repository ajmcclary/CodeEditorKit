# SwiftLint Configuration for CodeEditorPlugin
# Optimized for Swift 6 and modern Swift patterns

# ===========================
# MARK: - File Paths
# ===========================

included:
  - Sources
  - Tests

excluded:
  - .build
  - Sources/**/*.generated.swift
  - Tests/**/*.generated.swift

# ===========================
# MARK: - Analyzer Rules
# ===========================

analyzer_rules:
  - capture_variable
  - explicit_self
  - typesafe_array_init
  - unused_declaration
  - unused_import
  - unused_parameter

# ===========================
# MARK: - Disabled Rules
# ===========================

disabled_rules:
  - attributes                              # SwiftUI @ViewBuilder patterns
  - closure_body_length                     # Complex SwiftUI views
  - file_length                            # Allow longer files for complex features
  - function_body_length                    # Allow longer function bodies
  - large_tuple                            # Sometimes needed for state
  - line_length                            # Handled by SwiftFormat
  - missing_docs                           # Documentation is optional for internal code
  - multiple_closures_with_trailing_closure # Common SwiftUI pattern
  - override_in_extension                   # Platform-specific extensions require overrides
  - required_deinit                        # Only add when cleanup is needed
  - static_operator                        # Operators need to be free functions
  - switch_case_alignment                  # Handled by SwiftFormat
  - switch_case_on_newline                 # Complex switch statements
  - todo                                   # We use TODOs for tracking
  - trailing_whitespace                    # Handled by SwiftFormat
  - type_body_length                       # Allow longer types
  - type_contents_order                    # Specific ordering needs

# ===========================
# MARK: - Opt-In Rules
# ===========================

opt_in_rules:
  # Accessibility
  - accessibility_trait_for_button
  
  # Arrays & Collections
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - sorted_first_last
  
  # Closures
  - closure_end_indentation
  - closure_spacing
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - unused_closure_parameter
  
  # Code Organization
  - collection_alignment
  - comma_inheritance
  - convenience_type
  - let_var_whitespace
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - no_extension_access_modifier
  - operator_usage_whitespace
  - pattern_matching_keywords
  - period_spacing
  - return_arrow_whitespace
  - sorted_imports
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  
  # Code Quality
  - direct_return
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - function_default_parameter_at_end
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - legacy_multiple
  - legacy_objc_type
  - local_doc_comment
  - lower_acl_than_parent
  - number_separator
  - object_literal
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - reduce_boolean
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - self_binding
  - shorthand_optional_binding
  - static_operator
  - strict_fileprivate
  - superfluous_disable_command
  - toggle_bool
  - unavailable_condition
  - unavailable_function
  - unhandled_throwing_task
  - unowned_variable_capture
  - untyped_error_in_catch
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value
  - weak_delegate
  - yoda_condition
  
  # Testing
  - balanced_xctest_lifecycle
  - empty_xctest_method
  - enum_case_associated_values_count
  - nimble_operator
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - single_test_class
  - xct_specific_matcher
  
  # Interface Builder (Prohibited)
  - ibinspectable_in_extension
  - private_action
  - private_outlet
  - private_subject
  - private_swiftui_state
  - prohibited_interface_builder
  - prohibited_super_call
  - strong_iboutlet
  - valid_ibinspectable
  
  # Localization
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle

# ===========================
# MARK: - Rule Configurations
# ===========================

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - at
    - by
    - dx
    - dy
    - id
    - is
    - no
    - ok
    - on
    - to
    - ui
    - up
    - x
    - y
    - z

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  allowed_symbols: ["_"]
  excluded:
    - UI

function_parameter_count:
  warning: 7
  error: 10
  ignores_default_parameters: true

cyclomatic_complexity:
  warning: 20
  error: 30
  ignores_case_statements: true

nesting:
  type_level:
    warning: 4
    error: 6
  function_level:
    warning: 5
    error: 7

private_outlet:
  allow_private_set: true

# ===========================
# MARK: - Custom Rules
# ===========================

custom_rules:
  no_print_statements:
    included: '.*\.swift'
    excluded: '.*Tests\.swift'
    name: "No print statements"
    regex: '\bprint\('
    message: "Use CrossPlatformLogger.logger() instead of print statements"
    severity: warning

  mark_formatting:
    included: '.*\.swift'
    name: "MARK Format"
    regex: '// MARK: -? (?![A-Z])'
    message: "MARK comment should be followed by a capitalized section name"
    severity: warning

  allow_nsstring_drawing:
    included: '.*\.swift'
    name: "Allow NSString Drawing"
    regex: 'NSString\(string:\s*[^)]+\)\.(?!draw)'
    message: "Use Swift String methods instead of NSString, except for drawing APIs"
    severity: warning

# ===========================
# MARK: - Configuration
# ===========================

reporter: "xcode"
strict: true
swiftlint_version: 0.59.1