# SwiftLint configuration for Allegory
# Optimized for Swift 6, TCA, and modern Swift concurrency

# Paths to include/exclude
# Only analyze files in Sources and Tests directories
included:
  - Sources
  - Tests

# Exclude everything else is handled by only including Sources and Tests
# But we can still exclude generated files within those directories
excluded:
  - .build
  - Sources/**/*.generated.swift
  - Tests/**/*.generated.swift

# Analyzer rules
analyzer_rules:
  - unused_declaration
  - unused_import
  - capture_variable
  - explicit_self
  - typesafe_array_init
  - unused_parameter # Swift 6 - catch unused parameters

# Rules configuration
disabled_rules:
  - file_length # Allow longer files for complex TCA features
  - type_body_length # Allow longer types for complex reducers
  - function_body_length # Allow longer reducer bodies
  - line_length # Handled by SwiftFormat
  - trailing_whitespace # Handled by SwiftFormat
  - todo # We use TODOs for tracking
  - missing_docs # Documentation is optional for internal code
  - switch_case_alignment # Handled by SwiftFormat
  - type_contents_order # TCA patterns have specific ordering needs
  - switch_case_on_newline # TCA switch statements can be complex
  - multiple_closures_with_trailing_closure # Common SwiftUI/TCA pattern
  - attributes # SwiftUI @ViewBuilder and TCA @Reducer patterns
  - closure_body_length # Complex SwiftUI views and TCA effects
  - large_tuple # TCA sometimes uses larger tuples for state
  - static_operator # Operators like <- need to be free functions for generic usage
  - override_in_extension # Platform-specific extensions require overrides

opt_in_rules:
  # Swift 6 & Concurrency
  - array_init
  # - attributes # Disabled
  - accessibility_trait_for_button # Better accessibility
  - balanced_xctest_lifecycle
  # - closure_body_length # Disabled
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
