<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>LSP · Three concepts</title>
  <link rel="stylesheet" href="../_shared/design-system/colors_and_type.css"/>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font: 13px/1.4 "SF Pro Text", -apple-system, system-ui, sans-serif; background: #f0eee9; }
    .pov { position: absolute; left: 0; right: 0; top: 100%; margin-top: 18px;
      display: flex; flex-direction: column; gap: 8px;
      font: 13px/1.4 -apple-system, system-ui, sans-serif; color: rgba(40,30,20,0.85); pointer-events: none; }
    .pov p { margin: 0; color: rgba(60,50,40,0.72); max-width: 820px; }
    .pov ul { margin: 0; padding-left: 18px; color: rgba(60,50,40,0.72); }
    .pov li { margin: 2px 0; }
    .pov strong { color: rgba(40,30,20,0.92); font-weight: 600; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="../_shared/design-canvas.jsx"></script>
  <script type="text/babel" src="../_shared/chrome.jsx"></script>
  <script type="text/babel" src="concept-a.jsx"></script>
  <script type="text/babel" src="concept-b.jsx"></script>
  <script type="text/babel" src="concept-c.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { LspA, LspB, LspC } = window;

    function POV({ pitch, pros, cons }) {
      return (
        <div className="pov">
          <p>{pitch}</p>
          <div style={{ display: "flex", gap: 24, marginTop: 4 }}>
            <div style={{ flex: 1 }}>
              <strong style={{ display: "block", marginBottom: 2, fontSize: 12, letterSpacing: 0.4, textTransform: "uppercase", color: "rgba(40,30,20,0.65)" }}>What this gets you</strong>
              <ul>{pros.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
            <div style={{ flex: 1 }}>
              <strong style={{ display: "block", marginBottom: 2, fontSize: 12, letterSpacing: 0.4, textTransform: "uppercase", color: "rgba(40,30,20,0.65)" }}>Where it might pinch</strong>
              <ul>{cons.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="concepts"
            title="LSP · three directions"
            subtitle="Same fleet of six servers — sourcekit-lsp, typescript-language-server, pylsp, rust-analyzer (remote, mid-handshake), gopls (errored), vscode-json (off) — exposed under three operator postures. Each board commits to how much of the LSP surface the user is allowed to see from inside the editor.">

            <DCArtboard id="a" label="A · STATUS — pip in status bar + popover" width={880} height={660}>
              <LspA.App/>
              <POV
                pitch="Editor-first.  LSP lives at the bottom edge of the window as a row of language pips coloured by LSPClient.ConnectionState (initialized · initializing · error). Clicking any pip opens a slim popover anchored to the status bar with the active server's config, capabilities matrix (initialized server capabilities from initialize response), and bulk actions (Restart · Open Trace · Diagnostics). A floating activity strip in the editor reports the last LSP request — method + RTT."
                pros={[
                  "Right cognitive bill — LSP is plumbing, not a destination",
                  "Surfaces the connection-state taxonomy where users will look for it: their existing status bar",
                  "Popover answers the 90 % case (\"why is completion slow / silent\") without leaving the editor",
                  "Scales to 5–6 servers cleanly — each gets its own pip",
                ]}
                cons={[
                  "No deep diagnostics view — for trace inspection you still need a separate window",
                  "Status-bar real estate is contested; on iOS-style sidebars the pip row may overflow",
                  "Power users (writing a remote LSP transport) will find this surface too thin",
                ]}/>
            </DCArtboard>

            <DCArtboard id="b" label="B · WORKBENCH — full operator triptych" width={880} height={660}>
              <LspB.App/>
              <POV
                pitch="A standalone Language Servers window.  Three columns — the server registry on the left (state · transport · uptime · open docs), the active server's detail page in the middle (header card + capabilities matrix + push-diagnostics tail), and a live log/trace pane on the right with level filter chips. Designed for: a contributor adding a new LSPServerConfiguration, an operator debugging a flaky pylsp, anyone proving a TLS-1.3 + cert-pinning connection is up."
                pros={[
                  "Every LSPManager surface in one place — no need to chase logs in the system console",
                  "Trace stream is filterable but stays live (INFO/WARN/ERROR with a green 'live' pip)",
                  "Capability matrix is the LSP initialize response made legible — teaches the protocol while you use it",
                  "Easiest path to support 'show me the workspace folder, retry policy, transport, auth headers' in one card",
                ]}
                cons={[
                  "Heavy.  Three columns at 880 px is tight; this concept really wants 1080+",
                  "Disconnected from the editor — users have to context-switch from where the work is",
                  "Trace tail at 11 entries/s burns attention fast; needs a 'pause' affordance once people start using it",
                ]}/>
            </DCArtboard>

            <DCArtboard id="c" label="C · COMMAND DECK — one-page ops console" width={880} height={660}>
              <LspC.App/>
              <POV
                pitch="Starship-console treatment.  No editor, no triptych. A single scrolling page: command bar on top, a fleet-health strip with all six pips and RTT per language, a 3-column grid of per-server cards (transport, RTT sparkline, capability dot matrix), and a request timeline at the bottom showing 30 s of LSP traffic per server. Best when the LSP surface is the foreground of the user's attention (devops, telemetry, conference demos)."
                pros={[
                  "Most legible 'fleet view' — six servers at once with rate of change visible per pane",
                  "RTT sparkline + capability dot matrix carry a lot of data in a small card",
                  "Timeline at the bottom is the seam between this concept and concept B's trace stream — same data, different lens",
                  "Command bar reduces every action (restart server X, open trace, register) to one keystroke",
                ]}
                cons={[
                  "Dashboard energy — useful but rarely the right default surface for a code editor",
                  "Per-card capability dots don't carry the same depth as concept B's matrix; need a hover or click to confirm",
                  "RTT sparkline is deterministic here — needs live data plumbing before it earns its keep",
                ]}/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
