<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>SyntaxHighlighting · Three concepts</title>
  <link rel="stylesheet" href="../_shared/design-system/colors_and_type.css"/>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font: 13px/1.4 "SF Pro Text", -apple-system, system-ui, sans-serif; background: #f0eee9; }
    .pov { position: absolute; left: 0; right: 0; top: 100%; margin-top: 18px;
      display: flex; flex-direction: column; gap: 8px;
      font: 13px/1.4 -apple-system, system-ui, sans-serif; color: rgba(40,30,20,0.85); pointer-events: none; }
    .pov p { margin: 0; color: rgba(60,50,40,0.72); max-width: 820px; }
    .pov ul { margin: 0; padding-left: 18px; color: rgba(60,50,40,0.72); }
    .pov li { margin: 2px 0; }
    .pov strong { color: rgba(40,30,20,0.92); font-weight: 600; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="../_shared/design-canvas.jsx"></script>
  <script type="text/babel" src="../_shared/chrome.jsx"></script>
  <script type="text/babel" src="concept-a.jsx"></script>
  <script type="text/babel" src="concept-b.jsx"></script>
  <script type="text/babel" src="concept-c.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { ShA, ShB, ShC } = window;

    function POV({ pitch, pros, cons }) {
      return (
        <div className="pov">
          <p>{pitch}</p>
          <div style={{ display: "flex", gap: 24, marginTop: 4 }}>
            <div style={{ flex: 1 }}>
              <strong style={{ display: "block", marginBottom: 2, fontSize: 12, letterSpacing: 0.4, textTransform: "uppercase", color: "rgba(40,30,20,0.65)" }}>What this gets you</strong>
              <ul>{pros.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
            <div style={{ flex: 1 }}>
              <strong style={{ display: "block", marginBottom: 2, fontSize: 12, letterSpacing: 0.4, textTransform: "uppercase", color: "rgba(40,30,20,0.65)" }}>Where it might pinch</strong>
              <ul>{cons.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="concepts"
            title="Syntax Highlighting · three directions"
            subtitle="The same token taxonomy (TokenType + dotted TokenName children) and the same 25-language LanguageRegistry, presented under three different mental models — theme-author, host-developer, and spec-publisher.">

            <DCArtboard id="a" label="A · THEME EDITOR — token tree + side-by-side preview + inspector" width={880} height={660}>
              <ShA.App/>
              <POV
                pitch="Theme-author surface.  Triptych: a hierarchical token tree on the left (TokenType cases at depth 0, dotted TokenName children at depth 1 — they inherit via Theme.color(forToken:)'s fallback). The centre is a live preview rendered twice — LCARS Dark on the left half, LCARS Light on the right half, same source.  The inspector on the right is dedicated to the selected token: dark/light swatches with computed contrast, bold/italic toggles, and a 'bind to theme.style.syntax.<name>' affordance that writes back to the Theme."
                pros={[
                  "Side-by-side preview means you never ship a theme that's only contrasty in dark mode",
                  "Token tree exposes the inheritance behaviour explicitly — selecting 'keyword.control' shows you what it inherits from",
                  "Inspector is the only place that needs to know about italic / bold; rest of the UI stays purely chromatic",
                  "Mirrors Zed-compatible JSON one-for-one, so 'Export Zed JSON' is mechanical, not a remap",
                ]}
                cons={[
                  "Three columns at 880 px is the tightest of the six subsystems — the preview centre wants ~480 px alone",
                  "Token tree at 11 entries today reads fine; once theme authors register dotted custom captures it becomes a scroll",
                  "Contrast number is computed against the editor background only — selection / highlighted-line contrast not surfaced",
                ]}/>
            </DCArtboard>

            <DCArtboard id="b" label="B · WORKBENCH — language registry + editor + token histogram" width={880} height={660}>
              <ShB.App/>
              <POV
                pitch="Host-developer surface. Same three-pane skeleton but with a different axis: the left rail is the LanguageRegistry grouped by backing highlighter (SwiftSyntaxHighlighter · two flavours of RegexSyntaxHighlighter · PlainTextHighlighter); the centre is a single full-bleed editor preview; the right pane is a per-token histogram for the open document along with BackgroundSyntaxHighlighter status (cache hit %, last full vs last delta, incremental flag). Built for the integrator asking 'is highlighting cached, fast, and complete?'."
                pros={[
                  "Makes the registry's existence visible — 25 languages teach themselves in one screen",
                  "Histogram is grounded — every count is a number SmartTokenCache can produce today",
                  "Cache-hit % + last-delta-ms surface the perf budget without separate Performance settings",
                  "'SwiftSyntax' pill on Swift's row makes the special-case nature of swift-syntax legible at a glance",
                ]}
                cons={[
                  "No theme controls — for editing colours you still need concept A",
                  "Token histogram looks like a chart but is really a debug surface; non-developers will read too much into it",
                  "Registry list at 25 entries pushes the rail to the limit; another 10 languages will require a search affordance",
                ]}/>
            </DCArtboard>

            <DCArtboard id="c" label="C · SPEC DECK — single-page theme specification" width={880} height={660}>
              <ShC.App/>
              <POV
                pitch="Spec-publisher surface. One scrolling page that reads like an Apple developer doc — top metadata strip (theme name, schema version, editor BG / FG for both modes), a token table where every TokenType (and dotted child) gets a row with description, dark + light swatch, hex, contrast ratio, and a live sample expression rendered against both modes, and a footer slab that enumerates the LanguageRegistry's 25 languages grouped by highlighter backend."
                pros={[
                  "Most-printable surface — drops straight into the README or a release-notes blog post",
                  "Contrast ratio per swatch reads as an accessibility audit, not a guess",
                  "Sample-expression column is the most honest preview — every token gets its in-the-wild rendering",
                  "Doubles as the 'export Zed JSON / Swift literal' UI without a separate workflow",
                ]}
                cons={[
                  "Read-mostly — every edit requires a round-trip through concept A's inspector",
                  "Vertical scroll is unavoidable; the page wants to be ~1500 px tall at minimum",
                  "Status / diag colours (success / warning / error / info / caution) aren't on this page yet — they're a 17th-row family that needs another section",
                ]}/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
