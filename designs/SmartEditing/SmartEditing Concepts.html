<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>SmartEditing · Three concepts</title>
  <link rel="stylesheet" href="../_shared/design-system/colors_and_type.css"/>
  <style>
    html, body { margin: 0; height: 100%; }
    body { font: 13px/1.4 "SF Pro Text", -apple-system, system-ui, sans-serif; background: #f0eee9; }
    .pov { position: absolute; left: 0; right: 0; top: 100%; margin-top: 18px;
      display: flex; flex-direction: column; gap: 8px;
      font: 13px/1.4 -apple-system, system-ui, sans-serif; color: rgba(40,30,20,0.85); pointer-events: none; }
    .pov p { margin: 0; color: rgba(60,50,40,0.72); max-width: 820px; }
    .pov ul { margin: 0; padding-left: 18px; color: rgba(60,50,40,0.72); }
    .pov li { margin: 2px 0; }
    .pov strong { color: rgba(40,30,20,0.92); font-weight: 600; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="../_shared/design-canvas.jsx"></script>
  <script type="text/babel" src="../_shared/chrome.jsx"></script>
  <script type="text/babel" src="concept-a.jsx"></script>
  <script type="text/babel" src="concept-b.jsx"></script>
  <script type="text/babel" src="concept-c.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { SmA, SmB, SmC } = window;

    function POV({ pitch, pros, cons }) {
      return (
        <div className="pov">
          <p>{pitch}</p>
          <div style={{ display: "flex", gap: 24, marginTop: 4 }}>
            <div style={{ flex: 1 }}>
              <strong style={{ display: "block", marginBottom: 2, fontSize: 12, letterSpacing: 0.4, textTransform: "uppercase", color: "rgba(40,30,20,0.65)" }}>What this gets you</strong>
              <ul>{pros.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
            <div style={{ flex: 1 }}>
              <strong style={{ display: "block", marginBottom: 2, fontSize: 12, letterSpacing: 0.4, textTransform: "uppercase", color: "rgba(40,30,20,0.65)" }}>Where it might pinch</strong>
              <ul>{cons.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="concepts"
            title="Smart Editing · three directions"
            subtitle="The four moments — auto-bracket flash, multi-cursor stack, smart indent guides, selection-expansion HUD — under three different surfaces. Each board commits to a different audience: end-user, knob-tweaker, or contributor.">

            <DCArtboard id="a" label="A · MOMENTS — all four moments in one editor" width={880} height={660}>
              <SmA.App/>
              <POV
                pitch="The end-user surface.  A single editor showing every visible smart-editing moment simultaneously: a 4-cursor stack across L12–L15, a pulsing auto-bracket pair on L17, dashed indent guides at every level (one solid + tooltip on the active one), and a selection-expansion HUD anchored bottom-left showing word→line→scope→all. Nothing to configure; this is what the engine looks like in flight."
                pros={[
                  "Teaches the engine by example — no documentation needed to understand what it does",
                  "Density makes the demo legible without animation; every moment is visible at once",
                  "HUDs are non-modal and dismissable; the editor remains the foreground",
                  "Honest about cost — the multi-cursor stack reads as a heavy operation, not a free trick",
                ]}
                cons={[
                  "Not a real interaction surface — combining four moments in one frame is staged",
                  "On a 660-pt window the HUDs crowd the bottom; on a smaller window they'd overlap the indent tooltip",
                  "Auto-bracket pulse is on a 1.4 s loop here; in production it should fire once and decay",
                ]}/>
            </DCArtboard>

            <DCArtboard id="b" label="B · WORKBENCH — config knobs + live preview + bracket registry" width={880} height={660}>
              <SmB.App/>
              <POV
                pitch="The knob-tweaker surface. The left column is the full SmartEditingConfiguration verbatim, grouped (Auto-Bracketing · Multi-Cursor · Indentation · Selection Expansion). The middle is a live editor preview that responds: change Tab Width and indent guides reflow, toggle Multi-Cursor and a caret disappears, reorder the SelectionStop list and the HUD breadcrumb updates. The right column is the bracket-pair registry — six entries today, editable, add/remove."
                pros={[
                  "Best surface for tuning — what's two screens deep in Settings today is a one-screen workbench here",
                  "Preview is honest: every change visible immediately, every state coupled to one of the engine's APIs",
                  "Bracket registry on the right reads as the data it really is — pairs are configurable, not hardcoded",
                  "Shortcut card at the bottom anchors the knob list to the keystrokes they govern",
                ]}
                cons={[
                  "Three-pane workbench is heavy for what is, mostly, eight switches and a stepper",
                  "Live preview wants a wider editor pane than 880 px allows — long signatures wrap",
                  "Doesn't show the actual editor experience in context — users will still need concept A to evaluate UX",
                ]}/>
            </DCArtboard>

            <DCArtboard id="c" label="C · CHEAT SHEET — reference grid + component map" width={880} height={660}>
              <SmC.App/>
              <POV
                pitch="Single-page reference.  Eight small tiles, one per visible moment, each captioned with the keystroke and the engine API it calls. A 2×2 component map at the bottom names every type SmartEditingEngine delegates to (AutoBracketingEngine / MultiCursorEditor / SmartIndentationEngine / SmartSelectionExpander) and lists their public surface. No live preview, no settings — this is the answer to 'what does this thing do?' for contributors and reviewers."
                pros={[
                  "Carriest the most information per square cm — keystroke + API + behaviour on one page",
                  "Component map at the bottom is a direct trace from the published Swift surface to the visible moment",
                  "Tiles are illustrative, not interactive — refreshes cleanly without animation budget",
                  "Best target for documentation export — drop straight into the README as an image / SVG",
                ]}
                cons={[
                  "Static — without the live preview from concept B, contributors can't experiment from this page",
                  "Tile demos use staged code; conveying the dynamic nature of e.g. selection-expansion still requires concept A",
                  "Dense tile grid demands a scroll on smaller windows — printed-page energy",
                ]}/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
