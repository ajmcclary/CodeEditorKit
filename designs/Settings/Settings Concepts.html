<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Settings · Three concepts</title>
  <link rel="stylesheet" href="design-system/colors_and_type.css"/>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font: 13px/1.4 "SF Pro Text", -apple-system, system-ui, sans-serif;
      background: #f0eee9;
    }
    /* Concept-rationale block below each artboard's contents */
    .pov {
      position: absolute; left: 0; right: 0; top: 100%;
      margin-top: 18px;
      display: flex; flex-direction: column; gap: 8px;
      font: 13px/1.4 -apple-system, system-ui, sans-serif;
      color: rgba(40,30,20,0.85);
      pointer-events: none;
    }
    .pov h3 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -0.005em; }
    .pov p { margin: 0; color: rgba(60,50,40,0.72); max-width: 820px; }
    .pov ul { margin: 0; padding-left: 18px; color: rgba(60,50,40,0.72); }
    .pov li { margin: 2px 0; }
    .pov strong { color: rgba(40,30,20,0.92); font-weight: 600; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="concept-a.jsx"></script>
  <script type="text/babel" src="concept-b.jsx"></script>
  <script type="text/babel" src="concept-c.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { ConA, ConB, ConC } = window;

    function POV({ pitch, pros, cons }) {
      return (
        <div className="pov">
          <p>{pitch}</p>
          <div style={{ display: "flex", gap: 24, marginTop: 4 }}>
            <div style={{ flex: 1 }}>
              <strong style={{ display: "block", marginBottom: 2, fontSize: 12, letterSpacing: 0.4, textTransform: "uppercase", color: "rgba(40,30,20,0.65)" }}>What this gets you</strong>
              <ul>{pros.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
            <div style={{ flex: 1 }}>
              <strong style={{ display: "block", marginBottom: 2, fontSize: 12, letterSpacing: 0.4, textTransform: "uppercase", color: "rgba(40,30,20,0.65)" }}>Where it might pinch</strong>
              <ul>{cons.map((x, i) => <li key={i}>{x}</li>)}</ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="concepts"
            title="Settings · three directions"
            subtitle="Each board shows the Display tab — the richest mix of toggles, sliders, steppers and a colour row — under one concept's mental model. Window chrome and ~880×660 ideal size are constant across all three.">
            <DCArtboard id="a" label="A · CONSOLE — left rail + accent-coded sections" width={880} height={660}>
              <ConA.App/>
              <POV
                pitch="Closest to today's NavigationSplitView, but distinctively polished. The 7-category rail stays, every category gets its own accent stripe, and rows pick up modified-state dots with one-click revert. Defines a strong baseline visual vocabulary that the whole app can borrow (Tabs, Workspace, About) without learning new layouts."
                pros={[
                  "Lowest-risk migration path — the underlying KnobSection / KnobRow primitives still apply, you mostly skin them",
                  "Accent stripes finally pay off the 6-accent palette that's already in the data model",
                  "Search lives in-section header — easy to scope to the active category, or expand to global",
                  "Modified-state language (dot + Revert text-button) is reusable in every other panel",
                ]}
                cons={[
                  "Still fundamentally a wall-of-rows — only buys ~30% less density than today",
                  "Sliders + steppers compete for the same right-rail real estate — long-name knobs (e.g. 'completionTriggerCharacters') will wrap",
                  "Preview only happens 'in the editor in the background' — user has to keep glancing at the main window",
                ]}/>
            </DCArtboard>

            <DCArtboard id="b" label="B · TRIPTYCH — knobs on the left, live editor preview on the right" width={880} height={660}>
              <ConB.App/>
              <POV
                pitch="The preview is the headline. A persistent 312-px slab on the right renders a real mini-editor that responds to every knob in real time — font size, line numbers, minimap, folding chevrons, selected-line color, annotation badges. Categories become a tight icon rail; the search bar + 8 preset chips run across the top so the user can fly between configurations without leaving the panel."
                pros={[
                  "Solves the immediacy problem at the design layer — no need to context-switch to the editor window to evaluate a change",
                  "Presets get a permanent, glanceable surface, not buried in a menu",
                  "Global search is structurally elevated — it sits above every category",
                  "Best showcase of the design system (real syntax tokens, real gutter, real minimap silhouette)",
                ]}
                cons={[
                  "Live preview only makes sense for Display / Layout / (some of) Behavior — Performance, Workspace, Annotations, Theme need a different right-pane treatment",
                  "Narrower knob column means longer labels truncate or wrap more often",
                  "Min window 760 wide gets tight — the preview slab may need to be collapsible at <820px",
                ]}/>
            </DCArtboard>

            <DCArtboard id="c" label="C · COMMAND DECK — one page, command-bar driven, jump-link tracker" width={880} height={660}>
              <ConC.App/>
              <POV
                pitch="A single scrolling page in the Raycast / modern Xcode tradition. The command bar at the top is the primary input — type anything, jump anywhere, apply a preset, switch theme. A 152-px jump rail on the left tracks scroll. Each section gets a large accent-coloured slab so the user can navigate peripherally. 'Modified (3)' is a floating, dismissible pill — one click for the full revert popover."
                pros={[
                  "Keyboard-driven; the command bar collapses presets, theme picker, search, and navigation into one input",
                  "Big section headers are inherently brandable — that's where the LCARS / Star-Trek voice gets to breathe",
                  "Easiest answer to the '~70 knobs' problem — everything is reachable on one canvas, no tab tax",
                  "Workspace / Annotations / Theme don't need to fight the row-grid layout — they can be bespoke slabs in the same scroll",
                ]}
                cons={[
                  "Scroll-everywhere fatigue if the user is comparing two distant knobs (e.g. fontSize vs textChangeDebounceInterval)",
                  "Less obvious where 'modified' state lives — depends entirely on the floating pill being discoverable",
                  "Command-bar-driven nav demands keyboard culture; pointer-only users may miss it",
                ]}/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
